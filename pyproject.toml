[project]
name = "nexo"
version = "0.1.0"
description = "Graph RAG investigation stack: LangGraph orchestration, Strands micro-agent, vLLM, Neo4j"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "langchain-text-splitters>=1.1,<2",
    "numpy>=2,<3",  # InMemoryVectorStore similarity
    "strands-agents[openai]>=1.61,<2",
    "neo4j>=6.4,<7",
    "openai>=2.50,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "tenacity>=9.2,<10",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    # OTLP log export (OTEL_LOGS_EXPORTER=otlp); versioned with opentelemetry-sdk.
    "opentelemetry-instrumentation-logging==0.66b1",
    # Official GenAI instrumentation of the openai SDK (all vLLM calls). Beta:
    # pinned with its util package; do not also install instrumentation-openai-v2.
    "opentelemetry-instrumentation-genai-openai==1.2b0",
    "opentelemetry-util-genai==1.2b0",
    "mcp>=2.1,<3",  # Model Context Protocol server (`nexo mcp`)
    # `nexo setup`: the setup file, its lock and the rendered stack.
    "pyyaml>=6,<7",
    "jsonpatch>=1.33,<2",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3,<4", "psycopg[binary,pool]>=3.2,<4"]
aws = ["boto3>=1.35,<2"]
notebook = ["jupyterlab>=4.2,<5", "ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]
# secrets.provider keychain (local machines only): uv sync --extra keychain
keychain = ["keyring>=25.6,<26"]

[dependency-groups]
# Installed by `uv sync` by default; not part of the published package.
dev = ["pytest>=8", "pylint>=4.1,<5", "black>=26.1,<27"]

[project.scripts]
nexo = "nexo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests share helpers via `from tests.conftest import ...`
addopts = "-q"
markers = ["live: needs real model servers (NEXO_LIVE=1)"]

[tool.pylint.main]
source-roots = ["."]  # resolve `tests.*` imports the way pytest (pythonpath = ["."]) does
