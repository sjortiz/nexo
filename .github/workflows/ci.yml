name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # The Makefile targets developers run; RUN= uses the tools installed above.
      - name: Lint
        run: make lint RUN=
      # Containers only run on Linux runners; the Neo4j tests skip elsewhere.
      - name: Start Neo4j
        if: runner.os == 'Linux'
        run: make neo4j-test RUN= CONTAINER=docker
      - name: Test
        env:
          NEO4J_TEST_URI: ${{ runner.os == 'Linux' && 'bolt://127.0.0.1:7688' || '' }}
          NEO4J_TEST_PASSWORD: nexo-test-pass
        run: make test RUN=
