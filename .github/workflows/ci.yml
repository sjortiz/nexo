name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # the project publishes exact tags only
        with:
          enable-cache: true
      # Python from .python-version, dependencies exactly as in uv.lock.
      - name: Install
        run: uv sync --locked
      # The Makefile targets developers run.
      - name: Lint
        run: make lint
      # Containers only run on Linux runners; the Neo4j tests skip elsewhere.
      - name: Start Neo4j
        if: runner.os == 'Linux'
        run: make neo4j-test CONTAINER=docker
      - name: Test
        env:
          NEO4J_TEST_URI: ${{ runner.os == 'Linux' && 'bolt://127.0.0.1:7688' || '' }}
          NEO4J_TEST_PASSWORD: nexo-test-pass
        run: make test
