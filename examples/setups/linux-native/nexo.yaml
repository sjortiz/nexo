# Linux with a bare-metal core: Nexo (from the .venv), Neo4j from its package repository and
# Ollama (GPU or CPU) run on the machine. Containers are for telemetry (the collector and SigNoz)
# and add-ons only. Secrets stay in ~/.config/nexo/config; nothing goes in .env.
#   Ollama: curl -fsSL https://ollama.com/install.sh | sh; Neo4j: docs/operations/local-linux.md
#   make env PRESET=linux-native   (this file, with this machine's profile, and the secrets)
#   make neo4j-init                (a Neo4j that has never started: the stored password)
#   sudo systemctl start neo4j && make up && make check
apiVersion: nexo/v1alpha1
kind: Setup
metadata:
  name: nexo
spec:
  target:
    mode: native  # bare-metal core; telemetry and add-ons run in containers
    host: linux
    # machine: nexo-telemetry  # only if you run Podman in a machine (see mac-native)
  telemetry:
    enabled: true  # the collector and SigNoz; false: no export and no containers
  # addons:  # more containers next to the collector; Nexo reaches them on localhost ports
  #   langfuse: { enabled: true }
  #   jaeger: { enabled: true }
  #   agentInbox: { enabled: true }
  #   hostMetrics: { enabled: true }
  models:
    provider: ollama
    local:
      profile: cpu-64  # gpu-<VRAM GB> or cpu-<RAM GB>
