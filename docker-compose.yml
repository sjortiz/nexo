# Local/integration stack. Service names match the in-cluster defaults in
# config.py, so the same .env works here and in Kubernetes.
#   docker compose up -d neo4j otel-collector jaeger         # CPU-only pieces
#   docker compose --profile gpu up -d                        # + vLLM (4x80GB GPUs for 70B)
#   docker compose --profile app run --rm nexo ingest /corpus/memo.md --doc-type memo
#
# On a Mac the models run natively (Ollama, Metal GPU); set LOCAL_PROFILE (and
# REMOTE_PROFILE for two Macs) in .env and the nexo container reaches them on
# the host through host.containers.internal. See docs/operations/local-apple-silicon.md.

services:
  vllm-inference-service:
    profiles: ["gpu"]
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:?pin a vllm/vllm-openai release tag}
    command:
      - --model=meta-llama/Llama-3.3-70B-Instruct
      - --served-model-name=meta-llama/Llama-3.3-70B-Instruct
      - --tensor-parallel-size=4
      - --max-model-len=32768
      # Required for the Strands agent: turns Llama 3.x tool-call output into
      # OpenAI tool_calls. Without these the agent never calls its tools.
      - --enable-auto-tool-choice
      - --tool-call-parser=llama3_json
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    environment:
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN for the gated model}
    ipc: host
    volumes: [hf-cache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 4, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      start_period: 15m

  vllm-embedding-service:
    profiles: ["gpu"]
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:?pin a vllm/vllm-openai release tag}
    # Embedding architectures are served by the pooling runner automatically.
    command: ["--model=BAAI/bge-m3", "--api-key=${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY}"]
    volumes: [hf-cache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_db_transaction_timeout: 60s  # hard ceiling above the per-query timeout
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:8889:8889"]  # OTLP in, Prometheus metrics out
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["127.0.0.1:16686:16686"]

  nexo:
    build: .
    profiles: ["app"]
    env_file: [{ path: .env, required: false }]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NEO4J_URI: neo4j://neo4j:7687
      # Host services from inside the container: Ollama and the SSH tunnel to a second Mac.
      LOCAL_BASE_URL: http://host.containers.internal:11434/v1
      REMOTE_BASE_URL: http://host.containers.internal:11435/v1
    volumes: ["nexo-data:/app/.data", "./corpus:/corpus:ro"]  # documents to ingest
    depends_on:
      neo4j: { condition: service_healthy }

volumes:
  hf-cache:
  neo4j-data:
  nexo-data:
