# Generated by `make compose-file` from examples/setups/mac-single/nexo.yaml: one Mac, Neo4j,
# the collector and SigNoz with host metrics. Do not edit: change deploy/compose/ or the preset,
# then run make compose-file. Plain compose works (after make env, with Ollama on the host):
#   podman compose up -d
# Other setups and add-ons: nexo.yaml and make up (docs/operations/local-setup.md).
name: nexo
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run make env}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_db_transaction_timeout: 60s
    ports:
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:7474 || exit 1
      interval: 10s
      retries: 12
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.162.0
    command:
      - --config=/etc/otelcol/config.yaml
    depends_on:
      - signoz-ingester
    ports:
      - 127.0.0.1:4318:4318
      - 127.0.0.1:8889:8889
    user: '0'
    security_opt:
      - label=disable
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=${NEXO_HOST:-nexo-host}
    volumes:
      - ./deploy/rendered/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
  signoz:
    image: docker.io/signoz/signoz:v0.146.0
    depends_on:
      signoz-postgres:
        condition: service_healthy
      signoz-clickhouse:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    environment:
      SIGNOZ_SQLSTORE_PROVIDER: postgres
      SIGNOZ_SQLSTORE_POSTGRES_DSN: postgres://signoz:${SIGNOZ_POSTGRES_PASSWORD:?run make env}@signoz-postgres:5432/signoz?sslmode=disable
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_JWT_SECRET:?run make env}
      SIGNOZ_STATSREPORTER_ENABLED: 'false'
      SIGNOZ_USER_ROOT_ENABLED: 'true'
      SIGNOZ_USER_ROOT_EMAIL: ${SIGNOZ_USER_EMAIL:-admin@nexo.local}
      SIGNOZ_USER_ROOT_PASSWORD: ${SIGNOZ_USER_PASSWORD:?run make env}
      SIGNOZ_USER_ROOT_ORG_NAME: nexo
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/api/v1/health
      interval: 10s
      timeout: 10s
      retries: 30
  signoz-ingester:
    image: docker.io/signoz/signoz-otel-collector:v0.144.14
    depends_on:
      signoz-migrator:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
    command:
      - /signoz-otel-collector migrate sync check && /signoz-otel-collector --config=/etc/otel-collector-config.yaml
        --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
      LOW_CARDINAL_EXCEPTION_GROUPING: 'false'
    volumes:
      - ./deploy/signoz/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./deploy/signoz/opamp.yaml:/etc/opamp-config.yaml:ro
    restart: unless-stopped
  signoz-migrator:
    image: docker.io/signoz/signoz-otel-collector:v0.144.14
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - /signoz-otel-collector migrate ready && /signoz-otel-collector migrate bootstrap && /signoz-otel-collector
        migrate sync up && /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
      LOW_CARDINAL_EXCEPTION_GROUPING: 'false'
    restart: on-failure
  signoz-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12.5
    depends_on:
      signoz-keeper:
        condition: service_healthy
      signoz-clickhouse-scripts:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/config.yaml
    volumes:
      - signoz-clickhouse-data:/var/lib/clickhouse
      - signoz-clickhouse-scripts:/var/lib/clickhouse/user_scripts:ro,z
      - ./deploy/signoz/clickhouse/config.yaml:/etc/clickhouse-server/config.yaml:ro
      - ./deploy/signoz/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8123/ping
      interval: 5s
      timeout: 10s
      retries: 30
  signoz-clickhouse-scripts:
    image: docker.io/clickhouse/clickhouse-server:25.12.5
    command:
      - bash
      - -c
      - 'version="v0.0.1"

        node_os=$$(uname -s | tr ''[:upper:]'' ''[:lower:]'')

        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)

        cd /tmp

        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"

        tar -xzf histogram-quantile.tar.gz

        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile'
    volumes:
      - signoz-clickhouse-scripts:/var/lib/clickhouse/user_scripts:z
    restart: on-failure
  signoz-keeper:
    image: docker.io/clickhouse/clickhouse-keeper:25.12.5
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
    volumes:
      - signoz-keeper-data:/var/lib/clickhouse-keeper
      - ./deploy/signoz/keeper.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
    healthcheck:
      test:
        - CMD
        - clickhouse-keeper-client
        - -h
        - localhost
        - -p
        - '9181'
        - -q
        - ls
      interval: 5s
      timeout: 10s
      retries: 30
  signoz-postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: signoz
      POSTGRES_USER: signoz
      POSTGRES_PASSWORD: ${SIGNOZ_POSTGRES_PASSWORD:?run make env}
    volumes:
      - signoz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U signoz -d signoz
      interval: 3s
      timeout: 3s
      retries: 10
  nexo:
    build: .
    profiles:
      - app
    volumes:
      - nexo-data:/app/.data
      - ./corpus:/corpus:ro
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
      - path: ./deploy/rendered/nexo.env
        required: true
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NEO4J_URI: neo4j://neo4j:7687
      LOCAL_BASE_URL: http://host.containers.internal:11434/v1
volumes:
  neo4j-data: {}
  signoz-clickhouse-data: {}
  signoz-clickhouse-scripts: {}
  signoz-keeper-data: {}
  signoz-postgres-data: {}
  nexo-data: {}
