# Local/integration stack. Service names match the in-cluster defaults in
# config.py, so the same .env works here and in Kubernetes.
#   docker compose up -d neo4j otel-collector signoz        # make up
#   OTEL_LANGFUSE=langfuse docker compose --profile langfuse up -d ...  # + Langfuse (make up LANGFUSE=1)
#   OTEL_JAEGER=jaeger docker compose up -d ... jaeger      # + Jaeger (make up JAEGER=1)
#   OTEL_LANGSMITH=langsmith docker compose up -d ...       # + LangSmith (make up LANGSMITH=1)
#   docker compose --profile app run --rm nexo ingest /corpus/memo.md --doc-type memo
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d   # + vLLM on GPUs
#
# With Ollama, set LOCAL_PROFILE (and REMOTE_PROFILE for two machines) in .env;
# the nexo container reaches the host through host.containers.internal (macOS)
# or the host network (Linux: docker-compose.linux.yml). See docs/operations/local-setup.md.

include:
  - deploy/signoz/compose.yml    # SigNoz: traces, metrics, logs, dashboards and alerts
  - deploy/langfuse/compose.yml  # Langfuse add-on: LLM evaluation (profile "langfuse")

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_db_transaction_timeout: 60s  # hard ceiling above the per-query timeout
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    # Add-ons merge their own pipelines into the main config; "none" is an empty file.
    command:
      - --config=/etc/otelcol/config.yaml
      - --config=/etc/otelcol/addons/${OTEL_LANGFUSE:-none}.yaml
      - --config=/etc/otelcol/addons/${OTEL_JAEGER:-none}.yaml
      - --config=/etc/otelcol/addons/${OTEL_LANGSMITH:-none}.yaml
    # Root in the container to read the container engine's socket (container metrics); with
    # rootless Podman that is the unprivileged user that owns the socket.
    user: "0"
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./deploy/otel-addons:/etc/otelcol/addons:ro
      - /:/hostfs:ro  # host metrics; on macOS the host is the Podman VM
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    depends_on: [signoz-ingester]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:8889:8889"]  # OTLP in, Prometheus metrics out
    environment:
      # The Langfuse project's API keys (add-on), provisioned by deploy/langfuse/compose.yml.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-nexo}

  jaeger:  # add-on: make up JAEGER=1
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["jaeger"]
    ports: ["127.0.0.1:16686:16686"]

  nexo:
    build: .
    profiles: ["app"]
    env_file: [{ path: .env, required: false }]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NEO4J_URI: neo4j://neo4j:7687
      # Host services from inside the container: Ollama and the SSH tunnel to a second machine.
      LOCAL_BASE_URL: http://host.containers.internal:11434/v1
      REMOTE_BASE_URL: http://host.containers.internal:11435/v1
    volumes: ["nexo-data:/app/.data", "./corpus:/corpus:ro"]  # documents to ingest
    depends_on:
      neo4j: { condition: service_healthy }

volumes:
  neo4j-data:
  nexo-data:
