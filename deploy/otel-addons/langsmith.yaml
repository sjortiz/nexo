# Add-on: also send traces to LangSmith (make up LANGSMITH=1; LANGSMITH_API_KEY in .env, the
# project from addons.langsmith.project). Content is stripped first; no PHI without a BAA or
# self-hosting.
processors:
  # The run's question and answer (telemetry.content) stay on self-hosted backends.
  filter/strip-nexo-content:
    error_mode: ignore
    traces:
      spanevent:
        - 'name == "nexo.content"'

exporters:
  otlp_http/langsmith:
    endpoint: https://api.smith.langchain.com/otel
    headers:
      x-api-key: ${env:LANGSMITH_API_KEY}
      Langsmith-Project: ${env:LANGSMITH_PROJECT}

service:
  pipelines:
    traces/langsmith:
      receivers: [otlp]
      processors: [attributes/strip-content, filter/strip-content-events, filter/strip-nexo-content, batch]
      exporters: [otlp_http/langsmith]
