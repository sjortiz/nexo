# Add-on: Grafana's otel-lgtm container (make up LGTM=1) stores traces (Tempo), metrics
# (Prometheus) and logs (Loki), linked by trace id; Grafana on http://localhost:3001.
# Logs arrive only when Nexo exports them: OTEL_LOGS_EXPORTER=otlp.
exporters:
  otlphttp/lgtm:
    endpoint: http://lgtm:4318
    tls: { insecure: true }

service:
  pipelines:
    traces/lgtm:
      receivers: [otlp]
      processors: [attributes/strip-content, filter/strip-content-events, batch]
      exporters: [otlphttp/lgtm]
    metrics/lgtm:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/lgtm]
    logs/lgtm:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/lgtm]
