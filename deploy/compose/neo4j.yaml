# Neo4j, the knowledge graph (core component of `nexo setup`).
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run make env}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_db_transaction_timeout: 60s  # hard ceiling above the per-query timeout
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

volumes:
  neo4j-data:
