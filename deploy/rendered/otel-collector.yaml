# Generated by `make compose-file` from examples/setups/mac-single/nexo.yaml: one Mac, Neo4j,
# the collector and SigNoz with host metrics. Do not edit: change deploy/compose/ or the preset,
# then run make compose-file. Secrets come from the environment, never a file: run it as
#   nexo setup compose up -d    (passes them from ~/.config/nexo/config; or make up)
# Plain podman compose up -d needs them exported in its environment (local machines only).
# Other setups and add-ons: nexo.yaml and make up (docs/operations/local-setup.md).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      paging: {}
      disk: {}
      filesystem:
        include_mount_points:
          mount_points:
            - /hostfs
          match_type: strict
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 25s
processors:
  batch: {}
  attributes/strip-content:
    actions:
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: db.query.text
        action: delete
  filter/strip-content-events:
    error_mode: ignore
    traces:
      spanevent:
        - IsMatch(name, "^gen_ai\\.(system|user|assistant|tool)\\.message$")
        - name == "gen_ai.choice"
        - name == "gen_ai.client.inference.operation.details"
  resource_detection:
    detectors:
      - env
      - system
    system:
      hostname_sources:
        - os
exporters:
  otlp_grpc/signoz:
    endpoint: signoz-ingester:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - attributes/strip-content
        - filter/strip-content-events
        - batch
      exporters:
        - otlp_grpc/signoz
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_grpc/signoz
        - prometheus
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_grpc/signoz
    metrics/infra:
      receivers:
        - host_metrics
        - docker_stats
      processors:
        - resource_detection
        - batch
      exporters:
        - otlp_grpc/signoz
