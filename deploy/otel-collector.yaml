receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  # Infrastructure: the machine the containers run on (the Podman VM on macOS) and each container.
  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem:
        exclude_fs_types: { fs_types: [overlay, tmpfs, devtmpfs, proc, sysfs, cgroup2], match_type: strict }
      network: {}
      paging: {}
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s

processors:
  batch: {}
  # Names the infrastructure data like New Relic's infrastructure agent does.
  resourcedetection:
    detectors: [env, system]
    system: { hostname_sources: [os] }
  # Second line behind OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=no_content:
  # never export GenAI message content, even if a library records it.
  attributes/strip-content:
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      - { key: gen_ai.tool.call.arguments, action: delete }
      - { key: gen_ai.tool.call.result, action: delete }
      - { key: gen_ai.prompt, action: delete }          # legacy
      - { key: gen_ai.completion, action: delete }      # legacy
      - { key: db.query.text, action: delete }
  # Strands and older instrumentations put content in span events.
  filter/strip-content-events:
    error_mode: ignore
    traces:
      spanevent:
        - 'IsMatch(name, "^gen_ai\\.(system|user|assistant|tool)\\.message$")'
        - 'name == "gen_ai.choice"'
        - 'name == "gen_ai.client.inference.operation.details"'

exporters:
  # Self-hosted SigNoz (deploy/signoz/compose.yml): traces, metrics and logs.
  otlp/signoz:
    endpoint: signoz-ingester:4317
    tls: { insecure: true }
  prometheus:
    endpoint: 0.0.0.0:8889

# Langfuse, Jaeger and LangSmith are add-ons with their own pipelines: deploy/otel-addons/.
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip-content, filter/strip-content-events, batch]
      exporters: [otlp/signoz]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz, prometheus]
    metrics/infra:
      receivers: [hostmetrics, docker_stats]
      processors: [resourcedetection, batch]
      exporters: [otlp/signoz]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]
