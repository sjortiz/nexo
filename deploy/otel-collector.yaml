extensions:
  # Langfuse authenticates OTLP with Basic auth: public key and secret key.
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Second line behind OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=no_content:
  # never export GenAI message content, even if a library records it.
  attributes/strip-content:
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      - { key: gen_ai.tool.call.arguments, action: delete }
      - { key: gen_ai.tool.call.result, action: delete }
      - { key: gen_ai.prompt, action: delete }          # legacy
      - { key: gen_ai.completion, action: delete }      # legacy
      - { key: db.query.text, action: delete }
  # Strands and older instrumentations put content in span events.
  filter/strip-content-events:
    error_mode: ignore
    traces:
      spanevent:
        - 'IsMatch(name, "^gen_ai\\.(system|user|assistant|tool)\\.message$")'
        - 'name == "gen_ai.choice"'
        - 'name == "gen_ai.client.inference.operation.details"'

exporters:
  # Self-hosted Langfuse (deploy/langfuse/compose.yml); the exporter adds /v1/traces.
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    auth: { authenticator: basicauth/langfuse }
    headers:
      x-langfuse-ingestion-version: "4"  # without it, traces can take minutes to appear
  prometheus:
    endpoint: 0.0.0.0:8889
  # Logs (OTEL_LOGS_EXPORTER=otlp) are kept only by an add-on that stores them (lgtm).
  nop: {}

# Jaeger, LangSmith and Grafana LGTM are add-ons with their own pipelines: deploy/otel-addons/.
service:
  extensions: [basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip-content, filter/strip-content-events, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [nop]
