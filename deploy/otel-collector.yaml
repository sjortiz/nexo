receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Second line behind OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=no_content:
  # never export GenAI message content, even if a library records it.
  attributes/strip-content:
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      - { key: gen_ai.tool.call.arguments, action: delete }
      - { key: gen_ai.tool.call.result, action: delete }
      - { key: gen_ai.prompt, action: delete }          # legacy
      - { key: gen_ai.completion, action: delete }      # legacy
      - { key: db.query.text, action: delete }
      - { key: nexo.query.text, action: delete }  # kept with telemetry.queryText
  # Strands and older instrumentations put content in span events.
  filter/strip-content-events:
    error_mode: ignore
    traces:
      spanevent:
        - 'IsMatch(name, "^gen_ai\\.(system|user|assistant|tool)\\.message$")'
        - 'name == "gen_ai.choice"'
        - 'name == "gen_ai.client.inference.operation.details"'

exporters:
  # Self-hosted SigNoz (deploy/signoz/compose.yml): traces, metrics and logs.
  otlp_grpc/signoz:
    endpoint: signoz-ingester:4317
    tls: { insecure: true }
  prometheus:
    endpoint: 0.0.0.0:8889

# Add-ons (host metrics, Langfuse, Jaeger, LangSmith) bring their own pipelines from
# deploy/otel-addons/; `nexo setup render` merges the enabled ones into this file.
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip-content, filter/strip-content-events, batch]
      exporters: [otlp_grpc/signoz]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/signoz, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/signoz]
